# Custom alerting rules picked up by Prometheus (ruleSelectorNilUsesHelmValues=false)
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: demo-alerts
  namespace: demo
spec:
  groups:
    - name: demo.rules
      rules:
        - alert: PodinfoHighCPU
          expr: sum(rate(container_cpu_usage_seconds_total{namespace="demo", pod=~"podinfo-.*", container="podinfo"}[2m])) by (pod) > 0.1
          for: 1m
          labels: {severity: warning}
          annotations:
            summary: "podinfo pod {{ $labels.pod }} uses > 100m CPU"
            description: "CPU usage is {{ $value | humanize }} cores for more than 1 minute."
        - alert: PodinfoTargetDown
          expr: up{namespace="demo", service="podinfo"} == 0
          for: 1m
          labels: {severity: critical}
          annotations:
            summary: "Prometheus cannot scrape podinfo pod {{ $labels.pod }}"
        - alert: DemoPodCrashLooping
          expr: increase(kube_pod_container_status_restarts_total{namespace="demo"}[5m]) > 2
          labels: {severity: critical}
          annotations:
            summary: "Pod {{ $labels.pod }} is restarting repeatedly"
