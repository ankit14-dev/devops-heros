# Load generator: 2 pods x 20 parallel request loops hammering the podinfo Service.
# Scale it to 0 (or delete it) to remove the load.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels: {app: load-generator}
  template:
    metadata:
      labels: {app: load-generator}
    spec:
      containers:
        - name: load
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              echo "sending traffic to http://podinfo.demo:9898 ..."
              for i in $(seq 1 20); do
                (while true; do wget -q -O /dev/null http://podinfo.demo:9898; done) &
              done
              wait
          resources:
            requests: {cpu: 50m}
