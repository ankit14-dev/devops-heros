# Demo application for monitoring: podinfo exposes /metrics (Prometheus), /healthz, /readyz,
# structured JSON logs, and endpoints to generate CPU load.
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
  namespace: demo
  labels: {app: podinfo}
spec:
  replicas: 2
  selector:
    matchLabels: {app: podinfo}
  template:
    metadata:
      labels: {app: podinfo}
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          command: ["./podinfo", "--port=9898", "--level=info"]
          ports:
            - {name: http, containerPort: 9898}
          livenessProbe:
            httpGet: {path: /healthz, port: 9898}
          readinessProbe:
            httpGet: {path: /readyz, port: 9898}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 300m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: podinfo
  namespace: demo
  labels: {app: podinfo}
spec:
  type: NodePort
  selector: {app: podinfo}
  ports:
    - {name: http, port: 9898, targetPort: 9898, nodePort: 30898}
---
# Tell the Prometheus Operator to scrape podinfo's /metrics every 15s
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: podinfo
  namespace: demo
spec:
  selector:
    matchLabels: {app: podinfo}
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
