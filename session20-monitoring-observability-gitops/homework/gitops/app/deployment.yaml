apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
  labels: {app: podinfo}
spec:
  replicas: 2
  selector:
    matchLabels: {app: podinfo}
  template:
    metadata:
      labels: {app: podinfo}
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          ports:
            - {name: http, containerPort: 9898}
          env:
            - name: PODINFO_UI_MESSAGE
              value: "Deployed by Argo CD from Git - version 1"
            - name: PODINFO_UI_COLOR
              value: "#34577c"
          readinessProbe:
            httpGet: {path: /readyz, port: 9898}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
