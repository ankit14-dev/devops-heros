# Session 17 - Complete CI/CD + DevSecOps pipeline
# App: session-17-devsecops/homework (Flask "DevSecOps Dashboard")
#
#  Code -> Build & Unit Test -> SAST (Bandit + CodeQL) -> SCA (pip-audit) -> Secret Scan (gitleaks)
#       -> Docker Build -> Container Image Scan (Trivy) -> SECURITY GATE -> Push Image (GHCR)
#       -> Deploy to Kubernetes (kind cluster on the runner) -> smoke test
name: "Session 17 - DevSecOps Pipeline"

on:
  push:
    branches: [main]
    paths:
      - "session-17-devsecops/homework/**"
      - ".github/workflows/session17-devsecops.yml"
  pull_request:
    branches: [main]
    paths:
      - "session-17-devsecops/homework/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_DIR: session-17-devsecops/homework
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/session17-devsecops
  TRIVY_VERSION: "0.75.0"
  GITLEAKS_VERSION: "8.30.1"

defaults:
  run:
    working-directory: session-17-devsecops/homework

jobs:
  # ------------------------------------------------------------------ 1
  build-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ env.APP_DIR }}/requirements-dev.txt
      - name: Install dependencies (build)
        run: pip install -r requirements-dev.txt
      - name: Byte-compile the application
        run: python -m compileall -q app
      - name: Run unit tests with coverage
        run: |
          mkdir -p reports
          python -m pytest -v --junitxml=reports/junit.xml --cov=app --cov-report=term | tee reports/pytest.txt
          {
            echo "### 🧪 Unit tests"
            echo '```'
            grep -E "passed|failed|TOTAL" reports/pytest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-test-reports
          path: ${{ env.APP_DIR }}/reports/

  # ------------------------------------------------------------------ 2a
  sast-bandit:
    name: SAST - Bandit
    needs: build-test
    runs-on: ubuntu-latest
    outputs:
      high: ${{ steps.scan.outputs.high }}
      medium: ${{ steps.scan.outputs.medium }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install bandit==1.9.4
      - name: Run Bandit (report only - the security gate decides)
        id: scan
        run: |
          mkdir -p reports
          bandit -r app -f json -o reports/bandit.json || true
          bandit -r app -f txt -o reports/bandit.txt || true
          HIGH=$(jq '[.results[] | select(.issue_severity=="HIGH")] | length' reports/bandit.json)
          MED=$(jq '[.results[] | select(.issue_severity=="MEDIUM")] | length' reports/bandit.json)
          echo "high=$HIGH" >> "$GITHUB_OUTPUT"
          echo "medium=$MED" >> "$GITHUB_OUTPUT"
          # annotations are visible on the run page (no sign-in needed)
          jq -r '.results[] | select(.issue_severity!="LOW") | "::warning file='"$APP_DIR"'/\(.filename),line=\(.line_number),title=Bandit \(.test_id) (\(.issue_severity))::\(.issue_text)"' reports/bandit.json
          echo "::notice title=SAST (Bandit)::$HIGH high, $MED medium severity findings"
          {
            echo "### 🔍 SAST (Bandit): $HIGH high, $MED medium"
            echo "| Severity | Test | Location | Issue |"
            echo "|---|---|---|---|"
            jq -r '.results[] | select(.issue_severity!="LOW") | "| \(.issue_severity) | \(.test_id) | \(.filename):\(.line_number) | \(.issue_text) |"' reports/bandit.json
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: sast-bandit-report
          path: ${{ env.APP_DIR }}/reports/

  # ------------------------------------------------------------------ 2b
  sast-codeql:
    name: SAST - CodeQL
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write      # upload results to the Security tab
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          source-root: ${{ env.APP_DIR }}
      - uses: github/codeql-action/analyze@v4
        with:
          category: session17-python

  # ------------------------------------------------------------------ 3
  sca:
    name: SCA - pip-audit
    needs: build-test
    runs-on: ubuntu-latest
    outputs:
      vulns: ${{ steps.scan.outputs.vulns }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pip-audit==2.10.1
      - name: Audit dependencies for known CVEs
        id: scan
        run: |
          mkdir -p reports
          pip-audit -r requirements.txt -f json -o reports/pip-audit.json || true
          VULNS=$(jq '[.dependencies[].vulns[]] | length' reports/pip-audit.json)
          echo "vulns=$VULNS" >> "$GITHUB_OUTPUT"
          echo "::notice title=SCA (pip-audit)::$VULNS known vulnerabilities in $(jq '.dependencies | length' reports/pip-audit.json) dependencies"
          {
            echo "### 📦 SCA (pip-audit): $VULNS known vulnerabilities"
            echo '```'
            jq -r '.dependencies[] | "\(.name)==\(.version)  vulns: \(.vulns | length)"' reports/pip-audit.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: sca-report
          path: ${{ env.APP_DIR }}/reports/

  # ------------------------------------------------------------------ 4
  secret-scan:
    name: Secret Scan - gitleaks
    needs: build-test
    runs-on: ubuntu-latest
    outputs:
      leaks: ${{ steps.scan.outputs.leaks }}
    steps:
      - uses: actions/checkout@v7
      - name: Install gitleaks ${{ env.GITLEAKS_VERSION }}
        run: |
          curl -sSfL -o /tmp/gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gl.tgz -C /tmp gitleaks && sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan the application source for secrets
        id: scan
        run: |
          mkdir -p reports
          gitleaks dir . --no-banner --redact -f json -r reports/gitleaks.json || true
          LEAKS=$(jq 'length' reports/gitleaks.json)
          echo "leaks=$LEAKS" >> "$GITHUB_OUTPUT"
          echo "::notice title=Secret scan (gitleaks)::$LEAKS secrets found"
          echo "### 🔑 Secret scan (gitleaks): $LEAKS secrets found" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: secret-scan-report
          path: ${{ env.APP_DIR }}/reports/

  # ------------------------------------------------------------------ 5
  docker-build:
    name: Docker Build
    needs: [sast-bandit, sast-codeql, sca, secret-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: |
          docker build -t session17-devsecops:${GITHUB_SHA::7} .
          docker images session17-devsecops
          docker save session17-devsecops:${GITHUB_SHA::7} | gzip > image.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: docker-image
          path: ${{ env.APP_DIR }}/image.tar.gz
          retention-days: 3

  # ------------------------------------------------------------------ 6
  image-scan:
    name: Container Image Scan - Trivy
    needs: docker-build
    runs-on: ubuntu-latest
    outputs:
      critical: ${{ steps.scan.outputs.critical }}
      high: ${{ steps.scan.outputs.high }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: docker-image
          path: ${{ env.APP_DIR }}
      - run: gunzip -c image.tar.gz | docker load
      - name: Install Trivy ${{ env.TRIVY_VERSION }}
        run: |
          curl -sSfL -o /tmp/trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          tar -xzf /tmp/trivy.tgz -C /tmp trivy && sudo install /tmp/trivy /usr/local/bin/trivy
          trivy --version
      - name: Scan image (fixable HIGH/CRITICAL only)
        id: scan
        run: |
          mkdir -p reports
          IMG=session17-devsecops:${GITHUB_SHA::7}
          trivy image --quiet --severity HIGH,CRITICAL --ignore-unfixed -f json -o reports/trivy.json $IMG
          trivy image --quiet --severity HIGH,CRITICAL --ignore-unfixed -f table -o reports/trivy.txt $IMG
          CRIT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' reports/trivy.json)
          HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' reports/trivy.json)
          echo "critical=$CRIT" >> "$GITHUB_OUTPUT"
          echo "high=$HIGH" >> "$GITHUB_OUTPUT"
          echo "::notice title=Image scan (Trivy)::$CRIT critical, $HIGH high fixable vulnerabilities"
          {
            echo "### 🐳 Image scan (Trivy): $CRIT critical, $HIGH high (fixable)"
            echo "| Severity | Package | Installed | Fixed | CVE |"
            echo "|---|---|---|---|---|"
            jq -r '.Results[]?.Vulnerabilities[]? | "| \(.Severity) | \(.PkgName) | \(.InstalledVersion) | \(.FixedVersion) | \(.VulnerabilityID) |"' reports/trivy.json | head -25
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: image-scan-report
          path: ${{ env.APP_DIR }}/reports/

  # ------------------------------------------------------------------ 7
  security-gate:
    name: Security Gate
    needs: [sast-bandit, sca, secret-scan, image-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate security policy
        working-directory: .
        env:
          SAST_HIGH: ${{ needs.sast-bandit.outputs.high }}
          SCA_VULNS: ${{ needs.sca.outputs.vulns }}
          LEAKS: ${{ needs.secret-scan.outputs.leaks }}
          IMG_CRIT: ${{ needs.image-scan.outputs.critical }}
        run: |
          # Policy: block on any HIGH SAST finding, any vulnerable dependency,
          # any leaked secret, or any fixable CRITICAL vulnerability in the image.
          check() {
            if [ "$2" -gt 0 ]; then echo "| ❌ $1 | $2 | FAIL |"; echo "::error title=Security gate - FAIL::$1: $2 finding(s)" >> /tmp/annotations
            else echo "| ✅ $1 | $2 | pass |"; echo "::notice title=Security gate - pass::$1: 0" >> /tmp/annotations; fi
          }
          FAILED=0
          {
            echo "## 🚦 Security Gate"
            echo "| Check | Findings | Result |"
            echo "|---|---|---|"
            check "SAST high severity (Bandit)" "$SAST_HIGH"
            check "Vulnerable dependencies (pip-audit)" "$SCA_VULNS"
            check "Leaked secrets (gitleaks)" "$LEAKS"
            check "Fixable CRITICAL image CVEs (Trivy)" "$IMG_CRIT"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          cat /tmp/annotations
          FAILED=$(grep -c FAIL "$GITHUB_STEP_SUMMARY" || true)
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::Security gate FAILED - image will NOT be pushed or deployed"
            exit 1
          fi
          echo "Security gate PASSED"

  # ------------------------------------------------------------------ 8
  push-image:
    name: Push Image (GHCR)
    needs: security-gate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: docker-image
          path: ${{ env.APP_DIR }}
      - run: gunzip -c image.tar.gz | docker load
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag and push the exact image that was scanned
        id: push
        run: |
          SHORT=${GITHUB_SHA::7}
          docker tag session17-devsecops:$SHORT $IMAGE_NAME:$SHORT
          docker tag session17-devsecops:$SHORT $IMAGE_NAME:latest
          docker push $IMAGE_NAME:$SHORT
          docker push $IMAGE_NAME:latest
          echo "image=$IMAGE_NAME:$SHORT" >> "$GITHUB_OUTPUT"
          echo "### 📦 Pushed \`$IMAGE_NAME:$SHORT\`" >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------ 9
  deploy-kubernetes:
    name: Deploy to Kubernetes (kind)
    needs: push-image
    runs-on: ubuntu-latest
    environment:
      name: kind-staging
    steps:
      - uses: actions/checkout@v7
      - name: Create a Kubernetes cluster (kind) on the runner
        uses: helm/kind-action@v1.15.1
        with:
          cluster_name: devsecops
      - name: Deploy manifests with the new image
        run: |
          kubectl version
          sed "s|__IMAGE__|${{ needs.push-image.outputs.image }}|" k8s/deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/service.yaml
          kubectl rollout status deployment/session17-python --timeout=180s
          kubectl get deploy,pods,svc -o wide
      - name: Smoke test through the Service
        run: |
          kubectl port-forward svc/session17-python 8080:80 >/dev/null 2>&1 &
          sleep 5
          curl -fs localhost:8080/health
          curl -fs localhost:8080/api/status
          {
            echo "## ☸️ Deployed to Kubernetes"
            echo '```'
            kubectl get deploy,pods,svc
            echo '```'
            echo "Health: \`$(curl -s localhost:8080/health)\`"
          } >> "$GITHUB_STEP_SUMMARY"
