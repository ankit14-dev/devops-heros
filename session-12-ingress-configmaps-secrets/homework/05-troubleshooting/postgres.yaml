# PostgreSQL server. Its password comes from the "pg-server-secret" (created with kubectl, correct value).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_USER, value: appuser}
            - {name: POSTGRES_DB, value: appdb}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: pg-server-secret, key: password}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "appuser"]}
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: {app: postgres}
  ports: [{port: 5432}]
