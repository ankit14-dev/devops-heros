# TEMPLATE ONLY - never commit real values.
# Create the real secret with:
#   kubectl create secret generic db-credentials \
#     --from-literal=DB_USER=app_user --from-literal=DB_PASSWORD='<password>'
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
type: Opaque
stringData:            # stringData = plain text; the API server base64-encodes it into .data
  DB_USER: "<username>"
  DB_PASSWORD: "<password>"
