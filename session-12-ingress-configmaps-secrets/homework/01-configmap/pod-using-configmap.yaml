apiVersion: v1
kind: Pod
metadata:
  name: configmap-demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo \"Starting in $APP_ENV with log level $LOG_LEVEL\"; sleep 3600"]
      # 1) inject ALL keys as environment variables
      envFrom:
        - configMapRef:
            name: app-config
      # 2) inject ONE key under a different variable name
      env:
        - name: UI_FLAG
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: FEATURE_NEW_UI
      # 3) mount the ConfigMap as files
      volumeMounts:
        - name: config-volume
          mountPath: /etc/app-config
          readOnly: true
  volumes:
    - name: config-volume
      configMap:
        name: app-config
