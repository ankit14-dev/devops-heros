# FIXED: DATABASE_URL is now set
apiVersion: v1
kind: Pod
metadata:
  name: crashloop-app
spec:
  containers:
    - name: python-app
      image: python:3.11-alpine3.19
      env:
        - name: DATABASE_URL          # FIX: provide the missing variable
          value: "postgres://app@db:5432/app"
      command: ["python3", "-c"]
      args:
        - |
          import os, sys, time
          db_url = os.environ.get("DATABASE_URL")
          if not db_url:
              print("[FATAL ERROR]: DATABASE_URL environment variable is MISSING!", file=sys.stderr)
              sys.exit(1)
          print(f"Application started successfully! DB={db_url}")
          time.sleep(3600)
