# FIXED: app binds to 0.0.0.0 so other pods can reach it
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
spec:
  replicas: 1
  selector: {matchLabels: {app: inventory}}
  template:
    metadata: {labels: {app: inventory}}
    spec:
      containers:
        - name: app
          image: python:3.11-alpine3.19
          command: ["python3", "-m", "http.server", "8000", "--bind", "0.0.0.0"]   # FIX: listen on all interfaces
          ports: [{containerPort: 8000}]
          readinessProbe:            # also added: rollout only finishes when the port really accepts connections
            tcpSocket: {port: 8000}
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata: {name: inventory}
spec:
  selector: {app: inventory}
  ports: [{port: 80, targetPort: 8000}]
