# Allocates ~100MiB with a 20Mi limit -> OOMKilled (based on scenario-5-oomkilled)
apiVersion: v1
kind: Pod
metadata:
  name: oom-app
spec:
  restartPolicy: Never
  containers:
    - name: memory-leaker
      image: python:3.11-alpine3.19
      command: ["python3", "-c"]
      args:
        - |
          print("Allocating memory rapidly...", flush=True)
          chunks = []
          for i in range(10):
              chunks.append(b"x" * (10 * 1024 * 1024))
          print(f"allocated {len(chunks)*10} MiB - done", flush=True)
      resources:
        limits:
          memory: "20Mi"
