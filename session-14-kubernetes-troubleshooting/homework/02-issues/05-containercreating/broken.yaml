# Pod mounts a ConfigMap that does not exist -> stuck in ContainerCreating (FailedMount)
apiVersion: v1
kind: Pod
metadata:
  name: containercreating-app
spec:
  containers:
    - name: web
      image: nginx:1.27
      volumeMounts:
        - name: site-config
          mountPath: /etc/nginx/conf.d
  volumes:
    - name: site-config
      configMap:
        name: nginx-site-config      # <- not created yet
