# Default values for the TaskBoard chart.

environment: kubernetes

backend:
  image:
    repository: ghcr.io/ankit14-dev/taskboard-backend
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 2
  port: 8000
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 256Mi}
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60

frontend:
  image:
    repository: ghcr.io/ankit14-dev/taskboard-frontend
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 2
  port: 8080
  resources:
    requests: {cpu: 20m, memory: 32Mi}
    limits: {cpu: 200m, memory: 64Mi}

postgresql:
  image: postgres:16-alpine
  database: taskboard
  username: taskboard
  # Leave empty to auto-generate a random password (kept across upgrades).
  # Or point to a Secret you created yourself (key: postgres-password).
  existingSecret: ""
  storage:
    size: 1Gi
    storageClassName: ""      # "" = cluster default (minikube: standard)
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

ingress:
  enabled: true
  className: nginx
  host: taskboard.local
  tls: false

monitoring:
  serviceMonitor:
    enabled: true
    interval: 15s
  prometheusRule:
    enabled: true
  grafanaDashboard:
    enabled: true
