{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "taskboard.fullname" . }}
  labels: {{- include "taskboard.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ include "taskboard.fullname" . }}-tls
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: {name: {{ include "taskboard.fullname" . }}-backend, port: {number: 8000}}
          - path: /
            pathType: Prefix
            backend:
              service: {name: {{ include "taskboard.fullname" . }}-frontend, port: {number: 80}}
{{- end }}
