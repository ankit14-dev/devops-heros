{{- if and .Values.monitoring.serviceMonitor.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "taskboard.fullname" . }}-backend
  labels: {{- include "taskboard.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: {{- include "taskboard.selector" (dict "root" . "component" "backend") | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
---
{{- end }}
{{- if and .Values.monitoring.prometheusRule.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "taskboard.fullname" . }}-alerts
  labels: {{- include "taskboard.labels" . | nindent 4 }}
spec:
  groups:
    - name: taskboard.rules
      rules:
        - alert: TaskboardBackendDown
          expr: sum(up{namespace="{{ .Release.Namespace }}", service="{{ include "taskboard.fullname" . }}-backend"}) == 0
          for: 1m
          labels: {severity: critical}
          annotations:
            summary: "No TaskBoard backend pod can be scraped in {{ .Release.Namespace }}"
        - alert: TaskboardHighErrorRate
          expr: |
            sum(rate(http_requests_total{namespace="{{ .Release.Namespace }}", status=~"5.."}[5m]))
              / clamp_min(sum(rate(http_requests_total{namespace="{{ .Release.Namespace }}"}[5m])), 1) > 0.05
          for: 2m
          labels: {severity: warning}
          annotations:
            summary: "More than 5% of TaskBoard API requests fail with 5xx"
        - alert: TaskboardHighLatencyP95
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace="{{ .Release.Namespace }}"}[5m]))) > 0.5
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: "TaskBoard API p95 latency above 500ms"
        - alert: TaskboardPodRestarting
          expr: increase(kube_pod_container_status_restarts_total{namespace="{{ .Release.Namespace }}"}[10m]) > 2
          labels: {severity: warning}
          annotations:
            summary: "Pod {{ "{{" }} $labels.pod {{ "}}" }} restarted more than twice in 10 minutes"
---
{{- end }}
{{- if .Values.monitoring.grafanaDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "taskboard.fullname" . }}-dashboard
  labels: {{- include "taskboard.labels" . | nindent 4 }}
    grafana_dashboard: "1"     # picked up by the kube-prometheus-stack Grafana sidecar
data:
  taskboard.json: |-
{{ .Files.Get "dashboards/taskboard.json" | indent 4 }}
{{- end }}
