apiVersion: v1
kind: Pod
metadata:
  name: {{ include "taskboard.fullname" . }}-test
  labels: {{- include "taskboard.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: smoke
      image: curlimages/curl:8.5.0
      command: ["sh", "-c"]
      args:
        - |
          set -e
          curl -fsS http://{{ include "taskboard.fullname" . }}-backend:8000/ready
          curl -fsS http://{{ include "taskboard.fullname" . }}-frontend/healthz
          curl -fsS http://{{ include "taskboard.fullname" . }}-frontend/api/tasks/stats
